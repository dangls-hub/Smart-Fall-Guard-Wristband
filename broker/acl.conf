# Every device has its own username equal to device_id (e.g. esp32_001).
# Patterns apply to all users but match only that user's device subtree.
pattern write fallguard/v1/devices/%u/telemetry
pattern write fallguard/v1/devices/%u/alert
pattern write fallguard/v1/devices/%u/status
pattern write fallguard/v1/devices/%u/sync
pattern write fallguard/v1/devices/%u/command_ack
pattern read fallguard/v1/devices/%u/commands
pattern read fallguard/v1/devices/%u/event_ack

# Trusted backend: read device data and publish commands/receipt ACKs.
user fallguard_backend
topic read fallguard/v1/devices/+/telemetry
topic read fallguard/v1/devices/+/alert
topic read fallguard/v1/devices/+/status
topic read fallguard/v1/devices/+/sync
topic read fallguard/v1/devices/+/command_ack
topic write fallguard/v1/devices/+/commands
topic write fallguard/v1/devices/+/event_ack
