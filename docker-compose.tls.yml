# Requires Docker Compose >= 2.24.4. Use together with docker-compose.yml.
# !override replaces the plaintext port mapping instead of appending a port.
services:
  mosquitto:
    ports: !override
      - target: 8883
        published: "8883"
        host_ip: ${MQTT_BIND_ADDRESS:?Set MQTT_BIND_ADDRESS to the server LAN IP}
        protocol: tcp
    volumes:
      - ./broker/mosquitto.tls.conf:/mosquitto/config/mosquitto.conf:ro
      - type: bind
        source: ${MQTT_PASSWORD_FILE:-./broker/passwd}
        target: /mosquitto/config/passwd
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MQTT_TLS_DIR:-./certs/local}/server.crt
        target: /mosquitto/certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${MQTT_TLS_DIR:-./certs/local}/server.key
        target: /mosquitto/certs/server.key
        read_only: true
        bind:
          create_host_path: false
