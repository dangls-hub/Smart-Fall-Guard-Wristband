# Requires Docker Compose >= 2.24.4. Use together with docker-compose.yml.
# !override replaces the plaintext port mapping instead of appending a port.
services:
  mosquitto:
    ports: !override
      - "${MQTT_BIND_ADDRESS:?Set MQTT_BIND_ADDRESS to the server LAN IP}:8883:8883"
    volumes:
      - ./broker/mosquitto.tls.conf:/mosquitto/config/mosquitto.conf:ro
      - ./certs:/mosquitto/certs:ro
